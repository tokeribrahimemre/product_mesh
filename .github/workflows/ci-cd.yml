name: ProductMesh CI/CD

on:
  push:
    branches:
      - 'test/**'
      - 'prod/**'
      - main
  pull_request:
    branches:
      - main
      - 'prod/**'

env:
  DOTNET_VERSION: '10.0.x'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: 'Auth', test: 'tests/ProductMesh.Auth.Tests' }
          - { name: 'Product', test: 'tests/ProductMesh.Product.Tests' }
          - { name: 'Log', test: 'tests/ProductMesh.Log.Tests' }
          - { name: 'Gateway', test: '' }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ProductMesh.slnx

      - name: Build Solution
        run: dotnet build ProductMesh.slnx -c Release --no-restore

      - name: Test ${{ matrix.service.name }}
        if: matrix.service.test != ''
        run: dotnet test ${{ matrix.service.test }} -c Release --no-build --verbosity normal

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref_name == 'main' || startsWith(github.ref, 'refs/heads/prod/')
    strategy:
      matrix:
        service:
          - { name: 'auth', dockerfile: 'docker/Dockerfile.auth' }
          - { name: 'product', dockerfile: 'docker/Dockerfile.product' }
          - { name: 'log', dockerfile: 'docker/Dockerfile.log' }
          - { name: 'gateway', dockerfile: 'docker/Dockerfile.gateway' }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image — ${{ matrix.service.name }}
        run: docker build -f ${{ matrix.service.dockerfile }} -t productmesh-${{ matrix.service.name }}:${{ github.sha }} .
